<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root{--maxw:760px;--muted:#6b6b6b;--accent:#0a66c2}
      body{font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial;max-width:var(--maxw);margin:2.5rem auto;padding:0 1rem;color:#111;line-height:1.6}
      header{display:flex;justify-content:space-between;align-items:center}
      .brand{margin:0}
      nav a{color:var(--accent);text-decoration:none;margin-left:.75rem;font-weight:500}
      footer{color:var(--muted);font-size:.9rem;margin-top:2rem}
      hr{border:none;border-top:1px solid #ececec;margin:.75rem 0}
      @media (max-width:520px){body{margin:1.25rem auto}header{flex-direction:column;align-items:flex-start}nav{margin-top:.5rem}}
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>{{ site.title | default: "coming soon by Zihan" }}</h1>
        <div style="color:var(--muted);font-size:.95rem">{{ site.author | default: "" }}</div>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="/about.html">About</a>
        <a href="/blog.html">Blog</a>
        <a href="https://www.linkedin.com/in/zihanhuan" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <hr/>
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.author | default: "" }}</p>
    </footer>
  </body>
</html>
